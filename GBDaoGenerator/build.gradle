apply plugin: 'java'
apply plugin: 'maven-publish'
apply plugin:'application'

archivesBaseName = 'gadgetbridge-daogenerator'

dependencies {
    // https://github.com/Freeyourgadget/greenDAO/tree/fyg
    // JitPack currently returns 404 for the pinned commit coordinate, even
    // though refs/heads/fyg still points at that commit. Use the branch snapshot
    // so the recovery branch can be built again on a fresh machine.
    implementation 'com.github.Freeyourgadget:greendao:fyg-SNAPSHOT'
}

sourceSets {
    main {
        java {
            srcDir 'src'
        }
    }
}

mainClassName = "nodomain.freeyourgadget.gadgetbridge.daogen.GBDaoGenerator"

tasks.register('genSources', JavaExec) {
    mainClass = mainClassName
    classpath = sourceSets.main.runtimeClasspath
    workingDir = '../'
}

artifacts {
    archives jar
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

tasks.named("distTar") {
    duplicatesStrategy = 'include'
}

tasks.named("distZip") {
    duplicatesStrategy = 'include'
}
